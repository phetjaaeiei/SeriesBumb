name: Nightly D1 backup
# Off-site copy of production D1, encrypted before it leaves the runner (this repository is public,
# so artifacts are downloadable by anyone signed in to GitHub). Off until the owner adds:
#   secret   CLOUDFLARE_API_TOKEN   (Account › D1 › Edit, needed by `wrangler d1 export`)
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable BACKUP_AGE_RECIPIENT   (age public key; the private key never touches GitHub)
# See docs/runbooks/backup-restore.md.
on:
  schedule:
    - cron: '40 19 * * *' # 02:40 in Thailand, after the busiest hours
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup
  cancel-in-progress: false
jobs:
  d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "::notice::Nightly backup is off: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and BACKUP_AGE_RECIPIENT (docs/runbooks/backup-restore.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - if: steps.config.outputs.enabled == 'true'
        run: npm ci
      - if: steps.config.outputs.enabled == 'true'
        name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - if: steps.config.outputs.enabled == 'true'
        name: Export production D1 (data only, no sessions or tokens)
        run: node --experimental-strip-types scripts/backup-export.ts --database seriesbumb --remote --out "$RUNNER_TEMP/backup"
      - if: steps.config.outputs.enabled == 'true'
        name: Encrypt and remove plaintext
        run: |
          stamp=$(date -u +%F)
          tar -C "$RUNNER_TEMP/backup" -cf - . | age -r "$BACKUP_AGE_RECIPIENT" -o "seriesbumb-d1-$stamp.tar.age"
          find "$RUNNER_TEMP/backup" -type f -exec shred -u {} +
          ls -l seriesbumb-d1-*.tar.age
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seriesbumb-d1-backup
          path: seriesbumb-d1-*.tar.age
          if-no-files-found: error
          retention-days: 30
