version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      auth-db:
        patterns: ['better-auth', '@better-auth/*', 'drizzle-*']
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
